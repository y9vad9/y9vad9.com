name: Deploy to Cloudflare Pages

on:
  # Manual trigger only (disabled by default)
  workflow_dispatch:
  
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Restore Next.js Build Cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Restore Notes Compressed Assets Cache
        uses: actions/cache@v6
        with:
          path: |
            public/notes-assets
          key: ${{ runner.os }}-notes-assets-${{ hashFiles('content/notes/**/*.md', 'content/notes/**/*.png', 'content/notes/**/*.jpg', 'content/notes/**/*.jpeg', 'content/notes/**/*.svg') }}
          restore-keys: |
            ${{ runner.os }}-notes-assets-

      - run: npm ci
      
      - name: Build static export
        run: npm run build:static
      
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=y9vad9-site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
