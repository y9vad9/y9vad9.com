name: Test CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Restore Next.js Build Cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # The content-health tests encode every referenced image, because they
      # assert the *generated* file exists rather than just the source. That
      # is a real check, but re-doing it from cold on every push costs
      # minutes. Variant filenames are content-hashed, so a stale cache is
      # always safe: unchanged images are reused and anything else is simply
      # regenerated — hence the loose `restore-keys` fallback.
      - name: Restore generated image assets
        uses: actions/cache@v6
        with:
          path: public/notes-assets
          key: ${{ runner.os }}-notes-assets-${{ hashFiles('content/**', 'src/lib/images/**') }}
          restore-keys: |
            ${{ runner.os }}-notes-assets-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test
